<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather Data Query</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: linear-gradient(120deg, #89f7fe 0%, #66a6ff 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      background: #fff;
      margin-top: 60px;
      padding: 32px 40px 24px 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px #0002;
      max-width: 400px;
      width: 100%;
    }
    h2 {
      text-align: center;
      margin-bottom: 24px;
      color: #333;
    }
    label {
      display: block;
      margin-top: 18px;
      font-weight: 500;
      color: #444;
    }
    input[type="text"], input[type="date"] {
      width: 100%;
      padding: 10px 12px;
      margin-top: 6px;
      border: 1px solid #cfd8dc;
      border-radius: 6px;
      font-size: 1em;
      background: #f7fafc;
      transition: border 0.2s;
    }
    input[type="text"]:focus, input[type="date"]:focus {
      border: 1.5px solid #66a6ff;
      outline: none;
    }
    .note {
      font-size: 0.92em;
      color: #888;
      margin-top: 2px;
      margin-bottom: 0;
    }
    button {
      width: 100%;
      margin-top: 28px;
      padding: 12px 0;
      background: linear-gradient(90deg, #66a6ff 0%, #89f7fe 100%);
      color: #fff;
      font-size: 1.1em;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 2px 8px #66a6ff33;
      transition: background 0.2s;
    }
    button:hover {
      background: linear-gradient(90deg, #89f7fe 0%, #66a6ff 100%);
    }
    .widget {
      margin-top: 36px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 18px #0001;
      padding: 28px 32px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      animation: fadeIn 0.5s;
    }
    .temp {
      font-size: 2.6em;
      font-weight: bold;
      color: #2196f3;
      margin-bottom: 8px;
    }
    .widget-location {
      font-size: 1.1em;
      color: #444;
      margin-bottom: 4px;
    }
    .widget-date {
      font-size: 0.98em;
      color: #888;
      margin-bottom: 10px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px);}
      to { opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Weather Data Query</h2>
    <form id="weather-form">
      <label for="location">Location</label>
      <input type="text" id="location" name="location" placeholder="Enter location" required>

      <label for="start-date">Start Date <span style="color:#e53935">*</span></label>
      <input type="date" id="start-date" name="start-date" required>
      <div class="note">Choose only this if you want data for one specific date.</div>

      <label for="end-date">End Date (optional)</label>
      <input type="date" id="end-date" name="end-date">
      <div class="note">Choose this for range based date.</div>

      <button type="submit">Submit</button>
    </form>
  </div>
  <div id="weather-widget"></div>
  <script>
  async function fetchWeather(location, startDate, endDate) {
    // Build the endpoint URL
    let url = `http://localhost:3000/api/v1/weather/${location}/${startDate}`;
    if (endDate) url += `/${endDate}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("Failed to fetch weather data");
    return await res.json();
  }

  document.getElementById('weather-form').onsubmit = async function(e) {
    e.preventDefault();
    const location = document.getElementById('location').value;
    const startDate = document.getElementById('start-date').value;
    const endDate = document.getElementById('end-date').value;

    if (!startDate) {
      alert("Start date is required.");
      return;
    }

    const widget = document.getElementById('weather-widget');
    widget.innerHTML = `<div class="widget">Loading...</div>`;

    try {
      const data = await fetchWeather(location, startDate, endDate);
      // You can adjust how you display the data below as needed
      widget.innerHTML = `
        <div class="widget">
          <div class="temp">${data.days ? data.days[0].temp : data.temperature || "N/A"}°F</div>
          <div class="widget-location">${data.resolvedAddress || data.location || location}</div>
          <div class="widget-date">${startDate}${endDate ? " to " + endDate : ""}</div>
        </div>
      `;
    } catch (err) {
      widget.innerHTML = `<div class="widget" style="color:red;">Error fetching weather data.</div>`;
    }
  }
</script>
