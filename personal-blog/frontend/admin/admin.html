<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Blog List</title>
  <style>
    body { font-family: Arial; background: #f8f8f8; margin: 0; }
    .container { max-width: 700px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 10px; }
    .blog-list { list-style: none; padding: 0; }
    .blog-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
    .blog-title { font-weight: bold; }
    .actions button { margin-left: 10px; }
    .add-btn { margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <button class="add-btn" onclick="window.location.href='new.html'">+ Add Blog</button>
    <ul class="blog-list" id="blog-list"></ul>
  </div>
  <script src="../config.js"></script>
  <script>
    // Fetch all blogs from backend
    async function fetchBlogs() {
      const res = await fetch(`${window.API_BASE}/admin`);
      const blogs = await res.json();
      const list = document.getElementById('blog-list');
      list.innerHTML = '';
      blogs.forEach(blog => {
        const li = document.createElement('li');
        li.className = 'blog-item';
        li.innerHTML = `
          <span>
            <span class="blog-title">${blog.title}</span>
            <span style="color:#888; margin-left:10px;">${blog.date}</span>
          </span>
          <span class="actions">
            <button onclick="editBlog('${blog.id}')">Edit</button>
            <button onclick="deleteBlog('${blog.id}')">Delete</button>
          </span>
        `;
        list.appendChild(li);
      });
    }
    function editBlog(id) {
      window.location.href = `edit.html?id=${id}`;
    }
    async function deleteBlog(id) {
      if (!confirm('Delete this blog?')) return;
      await fetch(`${window.API_BASE}/delete/${id}`, { method: 'DELETE' });
      fetchBlogs();
    }
    fetchBlogs();
  </script>
</body>
</html>
